    type: country
    aliases: [republic of kazakhstan] # (observed)
  - id: ZA
    canonical: South Africa
    type: country
    aliases: [republic of south africa] # (observed)
  - { id: CO, canonical: Colombia, type: country } # (observed)
  - { id: BR, canonical: Brazil, type: country }
