  - { id: US-WI, canonical: Wisconsin, type: us_state } # (observed)
  - { id: US-WY, canonical: Wyoming, type: us_state }
  - id: US-DC
    canonical: District of Columbia
    type: us_federal_district # (observed)
    aliases:
      - washington, d.c.
      - washington dc

  # -------------------------------------------------------------- UK and Ireland
  # England appears five ways in CUAD. "England and Wales" is the legally correct
  # single jurisdiction; the others all collapse into it.
  - id: GB-EAW
    canonical: England and Wales
    type: country_subdivision
    aliases:
      - england # (observed)
      - england; wales # (observed)
      - england, united kingdom; wales, united kingdom # (observed)
      - england and wales, uk # (observed)
      - wales # (observed) appears as a component of "England; Wales"
      - england, united kingdom # (observed) component
      - wales, united kingdom # (observed) component
      - english law
      - laws of england
  - { id: GB-SCT, canonical: Scotland, type: country_subdivision }
  - { id: GB-NIR, canonical: Northern Ireland, type: country_subdivision }
  - id: GB
    canonical: United Kingdom
    type: country
    aliases: [uk, great britain]
  - { id: IE, canonical: Ireland, type: country, aliases: [republic of ireland] }

  # ---------------------------------------------------------------------- Canada
  # Canadian provinces are the governing law; "Canada" alone is not a forum for
  # contract law, so provinces are first-class entries.
  - id: CA-ON
    canonical: Ontario
    type: country_subdivision
    aliases:
      - ontario, canada # (observed)
      - province of ontario, canada # (observed)
      - province of ontario
  - id: CA-BC
    canonical: British Columbia
    type: country_subdivision # (observed)
    aliases:
      - british columbia, canada # (observed)
      - british columbia,canada # (observed) missing space in the source label
  - { id: CA-QC, canonical: Quebec, type: country_subdivision }
  - { id: CA-AB, canonical: Alberta, type: country_subdivision }
  - id: CA-NS
    canonical: Nova Scotia
    type: country_subdivision
    aliases: ["nova scotia, canada"] # (observed)
  - { id: CA, canonical: Canada, type: country }

  # ------------------------------------------------------------ Asia and Pacific
  - id: CN
    canonical: People's Republic of China
    type: country
    aliases:
      - china # (observed)
      - prc
      - beijing # (observed) a city, but used as a stand-in for PRC law
  - { id: HK, canonical: Hong Kong, type: country_subdivision } # (observed)
  - { id: TW, canonical: Taiwan, type: country } # (observed)
  - { id: JP, canonical: Japan, type: country } # (observed)
  - { id: KR, canonical: South Korea, type: country, aliases: [republic of korea] }
  - { id: IN, canonical: India, type: country } # (observed)
  - { id: SG, canonical: Singapore, type: country } # (observed)
  - { id: PG, canonical: Papua New Guinea, type: country } # (observed)
  - id: AU-VIC
    canonical: Victoria
    type: country_subdivision
    aliases: ["victoria, australia"] # (observed)
  - { id: AU-NSW, canonical: New South Wales, type: country_subdivision }
  - { id: AU, canonical: Australia, type: country }
  - { id: NZ, canonical: New Zealand, type: country }

  # ------------------------------------------------------------ Europe and other
  - id: DE
    canonical: Germany
    type: country
    aliases:
      - federal republic of germany # (observed)
  - { id: NL, canonical: Netherlands, type: country } # (observed)
