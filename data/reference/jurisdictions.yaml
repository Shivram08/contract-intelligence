# Closed vocabulary of governing-law jurisdictions.
#
# Feeds the `governing_law_resolves_to_known_jurisdiction` rule in
# src/docintel/validation/rules.py. A governing-law extraction that does not
# resolve to an `id` here is a rule violation, not a silent pass.
#
# Scope was set from the data, not from imagination: every `aliases` entry
# marked "(observed)" is a literal string that appears in the CUAD
# `Governing Law-Answer` column. See docs/DATA_AUDIT.md. CUAD's 434 labeled
# contracts use 77 distinct answer strings, and the long tail is almost entirely
# spelling variation -- England alone appears five different ways.
#
# Matching is expected to be case-insensitive with whitespace collapsed; the
# aliases below therefore vary only in wording, not in case or spacing.

version: 1

# Values that are NOT jurisdictions but appear in the governing-law field.
# The extractor must map to one of these rather than inventing a jurisdiction,
# so that "unparseable" is distinguishable from "wrong".
sentinels:
  - id: UNSPECIFIED
    description: No governing law clause, or the clause is present but names no forum.
    aliases:
      - "[]" # (observed) CUAD's empty-answer marker
      - "[* * *]" # (observed) redacted in the source filing
  - id: DEFERRED
    description: >-
      Governing law is determined by a condition rather than stated outright.
      Cannot be normalized to a jurisdiction and must route to review.
    aliases:
      - the state in which the breach occurs # (observed)
      - the state in which the franchised restaurant is located # (observed)
  - id: NON_JURISDICTIONAL_BODY_OF_LAW
    description: >-
      A named statute or treaty rather than a forum. Legitimate in the clause
      text but not a governing-law answer on its own.
    aliases:
      - united nations convention on contract for the international sale of goods # (observed)
      - the united states trademark act of 1946 # (observed)

jurisdictions:
  # ---------------------------------------------------------------- US federal
  - id: US
    canonical: United States
    type: country
    aliases:
      - united states # (observed)
      - usa
      - u.s.
      - united states of america

  # ------------------------------------------------------------------ US states
  # All 50 plus DC. Delaware and New York dominate commercial contracts;
  # the rest are here so the closed set is genuinely closed.
  - { id: US-AL, canonical: Alabama, type: us_state } # (observed)
  - { id: US-AK, canonical: Alaska, type: us_state }
  - { id: US-AZ, canonical: Arizona, type: us_state } # (observed)
  - { id: US-AR, canonical: Arkansas, type: us_state } # (observed)
  - { id: US-CA, canonical: California, type: us_state } # (observed)
  - { id: US-CO, canonical: Colorado, type: us_state } # (observed)
  - { id: US-CT, canonical: Connecticut, type: us_state } # (observed)
  - { id: US-DE, canonical: Delaware, type: us_state } # (observed)
  - { id: US-FL, canonical: Florida, type: us_state } # (observed)
  - { id: US-GA, canonical: Georgia, type: us_state } # (observed)
  - { id: US-HI, canonical: Hawaii, type: us_state }
  - { id: US-ID, canonical: Idaho, type: us_state }
  - { id: US-IL, canonical: Illinois, type: us_state } # (observed)
  - { id: US-IN, canonical: Indiana, type: us_state } # (observed)
  - { id: US-IA, canonical: Iowa, type: us_state } # (observed)
  - { id: US-KS, canonical: Kansas, type: us_state } # (observed)
  - { id: US-KY, canonical: Kentucky, type: us_state } # (observed)
  - { id: US-LA, canonical: Louisiana, type: us_state } # (observed)
  - { id: US-ME, canonical: Maine, type: us_state }
  - { id: US-MD, canonical: Maryland, type: us_state } # (observed)
  - id: US-MA
    canonical: Massachusetts
    type: us_state # (observed)
    aliases:
      - massachussets # (observed) misspelled in the CUAD label itself
  - { id: US-MI, canonical: Michigan, type: us_state } # (observed)
  - { id: US-MN, canonical: Minnesota, type: us_state } # (observed)
  - { id: US-MS, canonical: Mississippi, type: us_state }
  - { id: US-MO, canonical: Missouri, type: us_state } # (observed)
  - { id: US-MT, canonical: Montana, type: us_state }
  - { id: US-NE, canonical: Nebraska, type: us_state }
  - { id: US-NV, canonical: Nevada, type: us_state } # (observed)
  - { id: US-NH, canonical: New Hampshire, type: us_state }
  - { id: US-NJ, canonical: New Jersey, type: us_state } # (observed)
  - { id: US-NM, canonical: New Mexico, type: us_state }
  - { id: US-NY, canonical: New York, type: us_state } # (observed) most common
  - { id: US-NC, canonical: North Carolina, type: us_state } # (observed)
  - { id: US-ND, canonical: North Dakota, type: us_state }
  - { id: US-OH, canonical: Ohio, type: us_state } # (observed)
  - { id: US-OK, canonical: Oklahoma, type: us_state } # (observed)
  - { id: US-OR, canonical: Oregon, type: us_state }
  - { id: US-PA, canonical: Pennsylvania, type: us_state } # (observed)
  - { id: US-RI, canonical: Rhode Island, type: us_state }
  - { id: US-SC, canonical: South Carolina, type: us_state }
  - { id: US-SD, canonical: South Dakota, type: us_state } # (observed)
  - { id: US-TN, canonical: Tennessee, type: us_state } # (observed)
  - { id: US-TX, canonical: Texas, type: us_state } # (observed)
  - { id: US-UT, canonical: Utah, type: us_state }
  - { id: US-VT, canonical: Vermont, type: us_state }
  - { id: US-VA, canonical: Virginia, type: us_state } # (observed)
