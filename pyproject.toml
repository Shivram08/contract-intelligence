[project]
name = "docintel"
version = "0.1.0"
description = "Contract intelligence service: clause extraction from commercial contracts with enforced structure and measured evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shivram Nekkanti", email = "nekkanti.sh@northeastern.edu" }]

dependencies = [
    "anthropic>=0.40,<1.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pgvector>=0.3,<1.0",
    "pyyaml>=6.0,<7.0",
    "tiktoken>=0.8,<1.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "matplotlib>=3.9,<4.0",
    "opentelemetry-api>=1.28,<2.0",
    "opentelemetry-sdk>=1.28,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28,<2.0",
    "prometheus-client>=0.21,<1.0",
]

[project.optional-dependencies]
# Local embedding + reranking models. ~1.5 GB of weights plus torch; kept out of the
# default install so CI does not pay for them.
models = [
    "sentence-transformers>=3.3,<5.0",
    "torch>=2.5,<3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=6.0,<8.0",
    "testcontainers[postgres]>=4.8,<5.0",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docintel"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "evals", "scripts", "tests", "experiments"]
# ruff formats Python code fences inside Markdown; CLAUDE.md is a spec, not source.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert on magic values and use long literal fixtures.
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
# Extended as directories gain modules: experiments/ at M5.
files = ["src", "evals", "scripts", "tests"]
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true
show_error_codes = true

[[tool.mypy.overrides]]
# These ship without type information.
module = ["matplotlib.*", "pgvector.*", "testcontainers.*", "tiktoken.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ is not a package; audit_data is imported directly by its unit tests.
pythonpath = ["scripts"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: requires a live Postgres (deselect with '-m \"not integration\"')",
]
